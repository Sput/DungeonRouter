schema_version = 1

[llm_clients.openai]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_retries = 1

# Switchyard 0.2.0 does not flatten its Chat-style JSON Schema wrapper when
# encoding structured output for the Responses API. Keep answer generation on
# Responses, but use Chat Completions for the classifier until that is fixed.
[llm_clients.openai_classifier]
format = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_retries = 1

[targets.nano]
id = "gpt-5-nano"
llm_client = "openai"

[targets.mini]
id = "gpt-5-mini"
llm_client = "openai"

[targets.gpt5]
id = "gpt-5"
llm_client = "openai"

[targets.classifier_nano]
id = "gpt-5-nano"
llm_client = "openai_classifier"
# Classification only needs a tiny JSON verdict. Minimal reasoning prevents the
# model from consuming the entire output allowance before emitting that JSON.
extra_body = { reasoning_effort = "minimal" }

[routes.nano]
id = "dungeon-router/nano"
type = "passthrough"
target = "nano"

[routes.mini]
id = "dungeon-router/mini"
type = "passthrough"
target = "mini"

[routes.gpt5]
id = "dungeon-router/gpt-5"
type = "passthrough"
target = "gpt5"

[routes.auto]
id = "dungeon-router/auto"
type = "llm_classifier"
mode = "custom"
classifier_target = "classifier_nano"
targets = ["nano", "mini", "gpt5"]
default_target = "mini"
max_output_tokens = 2000
prompt = """
Route a grounded D&D 5e SRD question to the cheapest model likely to answer it correctly.

Apply these rules in priority order. Stop at the first matching tier:

1. Choose gpt5 when ANY of these are present: materially ambiguous timing; reactions or readied actions interrupting other actions; three or more interacting effects; conflicting rules; a long dependency chain; competing interpretations; or a request for multiple, all, or every defensible ruling. These are hard escalation triggers even if some individual rules are simple.
2. Otherwise choose mini when the answer combines two rules, explains an ordinary interaction, requires routine adjudication, makes a tactical recommendation, or supplements incomplete retrieval with reliable model knowledge.
3. Otherwise choose nano for a direct definition, one-passage lookup, extraction, or short factual answer supported by the retrieved passages.

Examples that MUST select gpt5:
- "A readied spell triggers while Counterspell is being cast and incapacitates its caster. Does Counterspell resolve? Give every defensible ruling."
- "Resolve Counterspell, a readied spell, and another Counterspell during one casting."
- "Explain competing interpretations of hiding while invisible during combat."

Classify the reasoning requested by the question, not how easy one isolated rule appears or how many relevant passages retrieval found.

Cost is the highest priority after correctness. Do not choose a larger model merely to improve prose. Return exactly one JSON object matching the response schema supplied with the request.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": { "type": "string", "enum": ["nano", "mini", "gpt5"] },
        "task_type": { "type": "string", "enum": ["direct_lookup", "rules_synthesis", "complex_adjudication"] },
        "reason": { "type": "string", "maxLength": 180 },
        "confidence": { "type": "number", "minimum": 0, "maximum": 1 }
      },
      "required": ["target", "task_type", "reason", "confidence"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.auto.policy]
type = "target_selector"
selector = "/decision/target"
