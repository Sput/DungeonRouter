schema_version = 1

[llm_clients.openai]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_retries = 1

[targets.nano]
id = "gpt-5-nano"
llm_client = "openai"

[targets.mini]
id = "gpt-5-mini"
llm_client = "openai"

[targets.gpt5]
id = "gpt-5"
llm_client = "openai"

[routes.nano]
id = "dungeon-router/nano"
type = "passthrough"
target = "nano"

[routes.mini]
id = "dungeon-router/mini"
type = "passthrough"
target = "mini"

[routes.gpt5]
id = "dungeon-router/gpt-5"
type = "passthrough"
target = "gpt5"

[routes.auto]
id = "dungeon-router/auto"
type = "llm_classifier"
mode = "custom"
classifier_target = "nano"
targets = ["nano", "mini", "gpt5"]
default_target = "mini"
max_output_tokens = 2000
prompt = """
Route a grounded D&D 5e SRD question to the cheapest model likely to answer it correctly.

Choose nano for a direct definition, one-passage lookup, extraction, or short factual answer.
Choose mini when the answer combines multiple rules, explains an interaction, or requires ordinary adjudication.
Choose gpt5 only for materially ambiguous timing, conflicting rules, long chains of interactions, or a request for multiple defensible rulings.

Cost is the highest priority after correctness. Do not choose a larger model merely to improve prose. Return exactly one JSON object matching the response schema supplied with the request.
"""
response_schema = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": { "type": "string", "enum": ["nano", "mini", "gpt5"] },
        "task_type": { "type": "string", "enum": ["direct_lookup", "rules_synthesis", "complex_adjudication"] },
        "reason": { "type": "string", "maxLength": 180 },
        "confidence": { "type": "number", "minimum": 0, "maximum": 1 }
      },
      "required": ["target", "task_type", "reason", "confidence"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.auto.policy]
type = "target_selector"
selector = "/decision/target"
